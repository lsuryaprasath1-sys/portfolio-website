                      <div className="text-xs text-slate-400 mt-1 flex flex-wrap gap-3">
                        <span>{suryaData.personal.location}</span>
                        <span>&bull;</span>
                        <span>{suryaData.personal.email}</span>
                        <span>&bull;</span>
                        <span>{suryaData.personal.phone}</span>
                      </div>
                    </div>
                    <img 
                      src={suryaData.personal.imagePath} 
                      alt="Surya Prasath"
                      className="w-16 h-16 rounded-xl object-cover object-top border border-dark-700"
                    />
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-white border-b border-dark-700 pb-1 mb-2">Profile Summary</h4>
                    <p className="text-xs text-slate-300 leading-relaxed">{suryaData.personal.headline}</p>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-white border-b border-dark-700 pb-1 mb-3">Work Experience</h4>
                    <div className="space-y-4">
                      {suryaData.experience.map((exp, idx) => (
                        <div key={idx} className="space-y-1">
                          <div className="flex justify-between text-xs font-bold">
                            <span className="text-white">{exp.role} — <span className="font-semibold text-accent">{exp.company}</span></span>
                            <span className="text-slate-400">{exp.period}</span>
                          </div>
                          <div className="text-[11px] text-slate-400 italic">{exp.location} | {exp.team}</div>
                          <ul className="list-disc list-inside text-xs text-slate-300 space-y-0.5 pt-1">
                            {exp.highlights.map((hl, hIdx) => (
                              <li key={hIdx} className="leading-relaxed">{hl}</li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-white border-b border-dark-700 pb-1 mb-2">Education</h4>
                    <div className="space-y-1 text-xs text-slate-300">
                      {suryaData.education.map((edu, idx) => (
                        <div key={idx} className="flex justify-between">
                          <span><strong>{edu.degree}</strong> &bull; {edu.institution}</span>
                          <span className="text-slate-400">{edu.year}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
