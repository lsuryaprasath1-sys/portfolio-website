              <div className="bg-white dark:bg-navy-900 rounded-2xl max-w-3xl w-full p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-6 max-h-[92vh] overflow-y-auto custom-scrollbar">
                
                {/* Modal Header */}
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
                  <div className="flex items-center gap-2">
                    <i data-lucide="file-text" className="w-5 h-5 text-emerald-500"></i>
                    <h3 className="font-bold text-slate-900 dark:text-white text-lg">Surya Prasath — Official Resume</h3>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => window.print()}
                      className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-1.5 transition"
                    >
                      <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                      Print / Save as PDF
                    </button>
                    <button 
                      onClick={() => setShowResumeModal(false)}
                      className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                    >
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>
                </div>

                {/* Printable Resume Container */}
                <div id="printable-resume" className="space-y-6 p-4 sm:p-6 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-slate-100">
                  <div className="border-b border-slate-200 dark:border-slate-800 pb-4 flex items-start justify-between">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-900 dark:text-white">{suryaData.personal.fullName}</h2>
                      <div className="text-emerald-600 dark:text-emerald-400 font-bold text-sm">{suryaData.personal.roleTitle}</div>
                      <div className="text-xs text-slate-500 dark:text-slate-400 mt-1 flex flex-wrap gap-3">
                        <span>{suryaData.personal.location}</span>
                        <span>&bull;</span>
                        <span>{suryaData.personal.email}</span>
                        <span>&bull;</span>
                        <span>{suryaData.personal.phone}</span>
                      </div>
                    </div>
                    <img 
                      src={suryaData.personal.imagePath} 
                      alt="Surya Prasath"
                      className="w-16 h-16 rounded-xl object-cover object-top border border-slate-300 dark:border-slate-700"
                    />
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-1 mb-2">Profile Summary</h4>
                    <p className="text-xs text-slate-700 dark:text-slate-300 leading-relaxed">{suryaData.executiveSummary}</p>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-1 mb-3">Key Skills & Competencies</h4>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px] text-slate-700 dark:text-slate-300">
                      <div>&bull; Store & Dark Store Ops</div>
                      <div>&bull; Inventory Management (FIFO)</div>
                      <div>&bull; Warehouse Management</div>
                      <div>&bull; Pick & Pack TAT Control</div>
                      <div>&bull; Shrinkage & Loss Mitigation</div>
                      <div>&bull; Manpower Planning</div>
                      <div>&bull; Inbound & Outbound Logistics</div>
                      <div>&bull; Performance Tracking & DSR</div>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-1 mb-3">Work Experience</h4>
                    <div className="space-y-4">
                      {suryaData.experience.map((exp, idx) => (
                        <div key={idx} className="space-y-1">
                          <div className="flex justify-between text-xs font-bold">
                            <span className="text-slate-900 dark:text-white">{exp.role} — <span className="font-semibold text-emerald-600 dark:text-emerald-400">{exp.company}</span></span>
                            <span className="text-slate-500 dark:text-slate-400">{exp.period}</span>
                          </div>
                          <div className="text-[11px] text-slate-500 dark:text-slate-400 italic">{exp.location} | {exp.team}</div>
                          <ul className="list-disc list-inside text-xs text-slate-700 dark:text-slate-300 space-y-0.5 pt-1">
                            {exp.highlights.map((hl, hIdx) => (
                              <li key={hIdx} className="leading-relaxed">{hl}</li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-1 mb-2">Education</h4>
                    <div className="space-y-2 text-xs text-slate-700 dark:text-slate-300">
                      {suryaData.education.map((edu, idx) => (
                        <div key={idx} className="flex justify-between">
                          <div>
                            <span className="font-semibold text-slate-900 dark:text-white">{edu.degree}</span> &bull; {edu.institution}
                          </div>
                          <span className="text-slate-500">{edu.year}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-1 mb-2">Languages & Personal</h4>
                    <div className="text-xs text-slate-700 dark:text-slate-300 flex flex-wrap gap-4">
                      <span><strong>Languages:</strong> Tamil (Native), English (Fluent)</span>
                      <span>&bull;</span>
                      <span><strong>Hobbies:</strong> Traveling, Tech-related Hobbies, Outdoor Activities</span>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
